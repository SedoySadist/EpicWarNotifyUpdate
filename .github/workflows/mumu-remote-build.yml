name: Build MuMu Remote APK

on:
  push:
    branches:
      - mumu-remote-control
    paths:
      - "mumu-remote-control/**"
      - ".github/workflows/mumu-remote-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate PC server
        run: python -m py_compile mumu-remote-control/pc-server/remote_server.py mumu-remote-control/pc-server/install_into_mumubot.py

      - name: Build debug APK
        working-directory: mumu-remote-control
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuMuRemote-debug
          path: mumu-remote-control/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


  build-upgrader:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate updater and remote server
        shell: pwsh
        run: |
          python -m py_compile mumu-remote-control/tools/v11_upgrader.py
          python -m py_compile mumu-remote-control/pc-server/remote_server.py

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build one-click v11 upgrader
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --name MuMuBot_v11_Upgrade --add-data "mumu-remote-control/pc-server/remote_server.py;." mumu-remote-control/tools/v11_upgrader.py

      - name: Upload v11 upgrader
        uses: actions/upload-artifact@v4
        with:
          name: MuMuBot-v11-Upgrade
          path: dist/MuMuBot_v11_Upgrade.exe
          if-no-files-found: error
