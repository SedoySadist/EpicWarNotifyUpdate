# MuMu Remote APK builder
name: Build MuMu Remote APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mumu-remote-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mumu-remote-control

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: mumu-remote-control
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuMuRemote-debug
          path: mumu-remote-control/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
